<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NESS Social UI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #080808;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: 'Orbitron', sans-serif;
}

/* =========================
   หน้าต่างหลัก
========================= */

.ui-window {
    width: min(90vw, 520px);
    min-height: min(88vh, 680px);

    padding: 25px;

    background:
        linear-gradient(
            145deg,
            #050505 0%,
            #050505 48%,
            #300000 48%,
            #b00000 100%
        );

    border: 4px solid #ff0000;

    display: flex;
    flex-direction: column;
    align-items: center;

    box-shadow:
        0 0 30px #ff000055,
        inset 0 0 30px #000;

    overflow: hidden;
}

/* =========================
   WELCOME
========================= */

.welcome {
    color: #ffffff;

    font-size: clamp(16px, 4vw, 24px);

    font-weight: 800;

    letter-spacing: 3px;

    text-align: center;

    margin-top: 5px;
    margin-bottom: 22px;

    text-shadow:
        0 0 8px #ff0000,
        0 0 20px #ff000088;

    min-height: 30px;
}

/* เคอร์เซอร์กระพริบ */

.welcome::after {
    content: "|";

    color: #ff0000;

    margin-left: 4px;

    animation: blink 0.7s infinite;
}

@keyframes blink {
    0%, 50% {
        opacity: 1;
    }

    51%, 100% {
        opacity: 0;
    }
}

/* =========================
   Subtitle
========================= */

.subtitle {
    color: #ff3333;

    font-size: clamp(9px, 2.5vw, 12px);

    letter-spacing: 4px;

    margin-top: -14px;
    margin-bottom: 22px;

    opacity: 0.9;
}

/* =========================
   รูปโปรไฟล์
========================= */

.circle {
    width: clamp(90px, 23vw, 135px);
    height: clamp(90px, 23vw, 135px);

    flex-shrink: 0;

    border-radius: 50%;

    border: 5px solid #ff0000;

    overflow: hidden;

    background: #000;

    box-shadow:
        0 0 20px #ff000099,
        0 0 40px #ff000033,
        inset 0 0 20px #000;

    margin-bottom: 28px;
}

.circle img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

/* =========================
   ปุ่ม Social
========================= */

.buttons {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 15px;
}

.button {
    width: 100%;

    height: clamp(58px, 9vh, 78px);

    background: #e00000;

    border: 4px solid #ff3333;

    color: white;

    display: flex;

    justify-content: center;
    align-items: center;

    font-family: 'Orbitron', sans-serif;

    font-size: clamp(15px, 4vw, 22px);

    font-weight: 700;

    letter-spacing: 2px;

    text-decoration: none;

    text-shadow:
        0 0 8px #ffffff55;

    box-shadow:
        0 0 12px #ff000066,
        inset 0 0 15px #8b0000;

    transition: 0.2s;

    cursor: pointer;
}

/* =========================
   โลโก้
========================= */

.social-icon {
    width: 32px;
    height: 32px;

    object-fit: contain;

    margin-right: 13px;

    flex-shrink: 0;

    filter:
        drop-shadow(0 0 5px #000);
}

/* =========================
   Hover
========================= */

.button:hover {
    background: #ff0000;

    transform: scale(1.02);

    box-shadow:
        0 0 25px #ff0000aa,
        inset 0 0 20px #ff5555;
}

.button:active {
    transform: scale(0.98);
}

/* =========================
   มือถือ
========================= */

@media (max-width: 600px) {

    .ui-window {
        width: 92vw;
        min-height: 88vh;

        padding: 18px;

        border-width: 3px;
    }

    .welcome {
        margin-bottom: 18px;
        letter-spacing: 2px;
    }

    .subtitle {
        margin-bottom: 18px;
    }

    .circle {
        margin-bottom: 23px;
    }

    .buttons {
        gap: 12px;
    }

    .button {
        height: 60px;
    }

    .social-icon {
        width: 28px;
        height: 28px;

        margin-right: 10px;
    }
}

/* =========================
   จอเล็กมาก
========================= */

@media (max-width: 380px) {

    .ui-window {
        width: 94vw;
        padding: 14px;
    }

    .welcome {
        font-size: 14px;
        letter-spacing: 1.5px;
    }

    .button {
        height: 55px;
        font-size: 14px;
    }

    .social-icon {
        width: 25px;
        height: 25px;
    }
}

</style>
</head>

<body>

<div class="ui-window">

    <!-- WELCOME แบบพิมพ์ทีละตัว -->
    <div class="welcome" id="welcome"></div>

    <div class="subtitle">
        NESS • DIGITAL SPACE
    </div>

    <!-- รูปโปรไฟล์ -->
    <div class="circle">
        <img src="NESS.png" alt="NESS">
    </div>

    <!-- ปุ่ม Social -->

    <div class="buttons">

        <!-- ROBLOX -->
        <a
            class="button"
            href="https://www.roblox.com/th/users/4523803501/profile"
            target="_blank"
            rel="noopener noreferrer"
        >
            <img
                src="Roblox.png"
                class="social-icon"
                alt="Roblox"
            >

            <span>ROBLOX</span>
        </a>

        <!-- TIKTOK -->
        <a
            class="button"
            href="https://www.tiktok.com/@nest280755"
            target="_blank"
            rel="noopener noreferrer"
        >
            <img
                src="tiktok.png"
                class="social-icon"
                alt="TikTok"
            >

            <span>TIKTOK</span>
        </a>

        <!-- INSTAGRAM -->
        <a
            class="button"
            href="https://www.instagram.com/dcnlp.hp2555/"
            target="_blank"
            rel="noopener noreferrer"
        >
            <img
                src="instagram.png"
                class="social-icon"
                alt="Instagram"
            >

            <span>INSTAGRAM</span>
        </a>

    </div>

</div>

<script>

/* =========================
   พิมพ์ WELCOME ทีละตัว
========================= */

const text = "WELCOME TO MY WORLD";
const welcome = document.getElementById("welcome");

let index = 0;

function typeWelcome() {

    if (index < text.length) {

        welcome.textContent += text.charAt(index);

        index++;

        setTimeout(typeWelcome, 100);

    }

}

typeWelcome();

</script>

</body>
</html>
