<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NESS Social UI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    font-family: 'Orbitron', sans-serif;
}

/* =========================
   พื้นหลัง
========================= */

body {

    min-height: 100vh;
    min-height: 100svh;

    background:
        radial-gradient(
            circle at center,
            #180000 0%,
            #080808 55%,
            #030303 100%
        );

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 20px;

    overflow: hidden;
}

/* =========================
   หน้าต่างหลัก
========================= */

.ui-window {

    width: min(90vw, 520px);

    /* ขนาดสำหรับคอม */
    height: min(88vh, 680px);

    padding: 25px;

    background:
        linear-gradient(
            145deg,
            #050505 0%,
            #050505 48%,
            #300000 48%,
            #b00000 100%
        );

    border: 4px solid #ff0000;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

    box-shadow:
        0 0 30px #ff000055,
        0 0 70px #ff000022,
        inset 0 0 30px #000;

    overflow: hidden;

    border-radius: 4px;
}

/* =========================
   WELCOME
========================= */

.welcome {

    width: 100%;

    min-height: 32px;

    color: #ffffff;

    font-size: clamp(16px, 4vw, 24px);

    font-weight: 800;

    letter-spacing: 3px;

    text-align: center;

    margin-top: 0;

    margin-bottom: 12px;

    text-shadow:
        0 0 8px #ff0000,
        0 0 20px #ff000088,
        0 0 35px #ff000044;

    white-space: nowrap;

    overflow: hidden;
}

/* =========================
   เคอร์เซอร์
========================= */

.welcome::after {

    content: "|";

    color: #ff0000;

    margin-left: 5px;

    animation: blink 0.7s infinite;
}

@keyframes blink {

    0%,
    50% {
        opacity: 1;
    }

    51%,
    100% {
        opacity: 0;
    }
}

/* =========================
   Subtitle
========================= */

.subtitle {

    color: #ff3333;

    font-size: clamp(8px, 2.3vw, 12px);

    letter-spacing: 3px;

    text-align: center;

    margin-bottom: 20px;

    opacity: 0.9;

    text-shadow:
        0 0 8px #ff000066;
}

/* =========================
   รูปโปรไฟล์
========================= */

.circle {

    width: clamp(90px, 22vw, 135px);

    height: clamp(90px, 22vw, 135px);

    flex-shrink: 0;

    border-radius: 50%;

    border: 5px solid #ff0000;

    overflow: hidden;

    background: #000;

    box-shadow:
        0 0 20px #ff000099,
        0 0 40px #ff000033,
        inset 0 0 20px #000;

    margin-bottom: 25px;
}

.circle img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;
}

/* =========================
   Social Buttons
========================= */

.buttons {

    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 14px;
}

/* =========================
   ปุ่ม
========================= */

.button {

    width: 100%;

    height: clamp(55px, 8vh, 72px);

    background:
        linear-gradient(
            90deg,
            #b00000,
            #e00000
        );

    border: 3px solid #ff3333;

    color: #ffffff;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: 'Orbitron', sans-serif;

    font-size: clamp(14px, 3.8vw, 21px);

    font-weight: 700;

    letter-spacing: 2px;

    text-decoration: none;

    text-shadow:
        0 0 8px #ffffff55;

    box-shadow:
        0 0 12px #ff000066,
        inset 0 0 15px #700000;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;

    cursor: pointer;

    border-radius: 2px;
}

/* =========================
   โลโก้
========================= */

.social-icon {

    width: 30px;

    height: 30px;

    object-fit: contain;

    margin-right: 12px;

    flex-shrink: 0;

    filter:
        drop-shadow(0 0 5px #000);
}

/* =========================
   Hover คอม
========================= */

.button:hover {

    background:
        linear-gradient(
            90deg,
            #e00000,
            #ff0000
        );

    transform: scale(1.025);

    box-shadow:
        0 0 25px #ff0000aa,
        inset 0 0 20px #ff5555;
}

/* =========================
   ตอนกด
========================= */

.button:active {

    transform: scale(0.98);
}

/* =========================
   มือถือ
========================= */

@media (max-width: 600px) {

    body {

        min-height: 100svh;

        padding: 10px;

        overflow: hidden;
    }

    .ui-window {

        width: 92vw;

        /* สำคัญ: ไม่บังคับให้สูง 88vh */
        height: auto;

        min-height: 0;

        padding: 16px;

        border-width: 3px;

        overflow: hidden;
    }

    .welcome {

        min-height: 25px;

        font-size: 15px;

        letter-spacing: 1.5px;

        margin-bottom: 8px;
    }

    .subtitle {

        font-size: 8px;

        letter-spacing: 2px;

        margin-bottom: 15px;
    }

    .circle {

        width: 88px;

        height: 88px;

        border-width: 4px;

        margin-bottom: 18px;
    }

    .buttons {

        gap: 10px;
    }

    .button {

        height: 55px;

        border-width: 3px;

        font-size: 14px;

        letter-spacing: 1px;
    }

    .social-icon {

        width: 25px;

        height: 25px;

        margin-right: 9px;
    }
}

/* =========================
   มือถือจอเล็กมาก
========================= */

@media (max-width: 380px) {

    body {

        padding: 7px;
    }

    .ui-window {

        width: 94vw;

        padding: 13px;
    }

    .welcome {

        font-size: 13px;

        letter-spacing: 1px;

        min-height: 22px;
    }

    .subtitle {

        font-size: 7px;

        letter-spacing: 1.5px;

        margin-bottom: 12px;
    }

    .circle {

        width: 78px;

        height: 78px;

        margin-bottom: 15px;
    }

    .buttons {

        gap: 8px;
    }

    .button {

        height: 50px;

        font-size: 13px;
    }

    .social-icon {

        width: 23px;

        height: 23px;

        margin-right: 8px;
    }
}

/* =========================
   จอสูงน้อย
========================= */

@media (max-height: 650px) {

    .ui-window {

        padding: 16px;
    }

    .welcome {

        margin-bottom: 7px;
    }

    .subtitle {

        margin-bottom: 10px;
    }

    .circle {

        width: 80px;

        height: 80px;

        margin-bottom: 14px;
    }

    .buttons {

        gap: 8px;
    }

    .button {

        height: 50px;
    }
}

</style>
</head>

<body>

<div class="ui-window">

    <!-- =========================
         WELCOME
    ========================== -->

    <div
        class="welcome"
        id="welcome"
    ></div>


    <!-- =========================
         Subtitle
    ========================== -->

    <div class="subtitle">
        NESS • DIGITAL SPACE
    </div>


    <!-- =========================
         รูปโปรไฟล์
    ========================== -->

    <div class="circle">

        <img
            src="NESS.png"
            alt="NESS"
        >

    </div>


    <!-- =========================
         Social Buttons
    ========================== -->

    <div class="buttons">


        <!-- ROBLOX -->

        <a
            class="button"
            href="https://www.roblox.com/th/users/4523803501/profile"
            target="_blank"
            rel="noopener noreferrer"
        >

            <img
                src="Roblox.png"
                class="social-icon"
                alt="Roblox"
            >

            <span>
                ROBLOX
            </span>

        </a>


        <!-- TIKTOK -->

        <a
            class="button"
            href="https://www.tiktok.com/@nest280755"
            target="_blank"
            rel="noopener noreferrer"
        >

            <img
                src="tiktok.png"
                class="social-icon"
                alt="TikTok"
            >

            <span>
                TIKTOK
            </span>

        </a>


        <!-- INSTAGRAM -->

        <a
            class="button"
            href="https://www.instagram.com/dcnlp.hp2555/"
            target="_blank"
            rel="noopener noreferrer"
        >

            <img
                src="instagram.png"
                class="social-icon"
                alt="Instagram"
            >

            <span>
                INSTAGRAM
            </span>

        </a>


    </div>

</div>


<script>

/* =========================
   WELCOME TYPEWRITER
========================= */

const text = "WELCOME TO MY WORLD";

const welcome = document.getElementById("welcome");

let index = 0;

function typeWelcome() {

    if (index < text.length) {

        welcome.textContent += text.charAt(index);

        index++;

        setTimeout(typeWelcome, 100);

    }

}

typeWelcome();

</script>

</body>
</html>
