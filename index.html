<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NESS // PROFILE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    font-family: 'Orbitron', sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 50% 50%,
            #300000 0%,
            #100000 20%,
            #050505 55%,
            #000000 100%
        );

    overflow: hidden;
}


/* =====================================================
   BACKGROUND GRID
===================================================== */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: .45;

    background-image:

        linear-gradient(
            rgba(255,0,0,.045) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,0,0,.045) 1px,
            transparent 1px
        );

    background-size: 35px 35px;

    mask-image:
        radial-gradient(
            circle,
            black 20%,
            transparent 85%
        );
}


/* =====================================================
   MOVING RED LIGHT
===================================================== */

body::after {

    content: "";

    position: fixed;

    width: 550px;
    height: 550px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #ff0000,
            transparent 70%
        );

    opacity: .07;

    filter: blur(80px);

    pointer-events: none;

    animation:
        backgroundMove 9s ease-in-out infinite alternate;
}

@keyframes backgroundMove {

    0% {
        transform:
            translate(-220px, -150px)
            scale(.8);
    }

    50% {
        transform:
            translate(80px, 40px)
            scale(1.1);
    }

    100% {
        transform:
            translate(220px, 160px)
            scale(.85);
    }

}


/* =====================================================
   MAIN CARD
===================================================== */

.ui-window {

    position: relative;

    width: min(92vw, 560px);

    padding: 30px;

    background:

        linear-gradient(
            135deg,
            rgba(3,3,3,.98),
            rgba(25,0,0,.97),
            rgba(5,5,5,.98)
        );

    border: 1px solid #ff2020;

    box-shadow:

        0 0 0 1px #ff000033,

        0 0 25px #ff000044,

        0 0 80px #ff000022,

        inset 0 0 50px #000;

    overflow: hidden;

    isolation: isolate;
}


/* =====================================================
   GLASS SHINE
===================================================== */

.ui-window::before {

    content: "";

    position: absolute;

    top: -100%;

    left: -60%;

    width: 50%;
    height: 300%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.08),
            transparent
        );

    transform: rotate(25deg);

    animation:
        cardShine 7s ease-in-out infinite;

    pointer-events: none;

    z-index: 5;
}

@keyframes cardShine {

    0% {
        left: -80%;
    }

    35% {
        left: 140%;
    }

    100% {
        left: 140%;
    }

}


/* =====================================================
   CYBER CORNERS
===================================================== */

.corner {

    position: absolute;

    width: 40px;
    height: 40px;

    pointer-events: none;

    z-index: 10;
}

.corner.tl {

    top: 0;
    left: 0;

    border-top: 3px solid #ff0000;
    border-left: 3px solid #ff0000;

    box-shadow:
        -5px -5px 15px #ff000088;
}

.corner.tr {

    top: 0;
    right: 0;

    border-top: 3px solid #ff0000;
    border-right: 3px solid #ff0000;

    box-shadow:
        5px -5px 15px #ff000088;
}

.corner.bl {

    bottom: 0;
    left: 0;

    border-bottom: 3px solid #ff0000;
    border-left: 3px solid #ff0000;

    box-shadow:
        -5px 5px 15px #ff000088;
}

.corner.br {

    bottom: 0;
    right: 0;

    border-bottom: 3px solid #ff0000;
    border-right: 3px solid #ff0000;

    box-shadow:
        5px 5px 15px #ff000088;
}


/* =====================================================
   SCAN LINE
===================================================== */

.scan {

    position: absolute;

    left: 0;

    width: 100%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff0000,
            #ffffff,
            #ff0000,
            transparent
        );

    opacity: .18;

    box-shadow:
        0 0 12px #ff0000,
        0 0 25px #ff0000;

    animation:
        scan 4s linear infinite;

    pointer-events: none;

    z-index: 4;
}

@keyframes scan {

    0% {
        top: -5%;
    }

    100% {
        top: 105%;
    }

}


/* =====================================================
   STATUS
===================================================== */

.status {

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 8px;

    margin-bottom: 13px;

    color: #888;

    font-size: 8px;

    letter-spacing: 4px;
}

.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #ff0000;

    box-shadow:

        0 0 6px #ff0000,
        0 0 16px #ff0000,
        0 0 30px #ff0000;

    animation:
        statusPulse 1.2s infinite;
}

@keyframes statusPulse {

    0%,
    100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .3;
        transform: scale(.7);
    }

}


/* =====================================================
   WELCOME
===================================================== */

.welcome {

    min-height: 35px;

    text-align: center;

    font-size: clamp(18px, 4vw, 28px);

    font-weight: 900;

    letter-spacing: 4px;

    color: white;

    text-shadow:

        0 0 8px #ff0000,
        0 0 20px #ff0000,
        0 0 45px #ff000055;

    animation:
        welcomeGlow 2s ease-in-out infinite alternate;
}

@keyframes welcomeGlow {

    from {
        text-shadow:
            0 0 8px #ff0000,
            0 0 18px #ff0000;
    }

    to {
        text-shadow:
            0 0 12px #ff0000,
            0 0 30px #ff0000,
            0 0 55px #ff000088;
    }

}

.welcome::after {

    content: "_";

    color: #ff0000;

    animation:
        cursor .65s infinite;
}

@keyframes cursor {

    0%,
    50% {
        opacity: 1;
    }

    51%,
    100% {
        opacity: 0;
    }

}


/* =====================================================
   SUBTITLE
===================================================== */

.subtitle {

    margin-top: 5px;

    margin-bottom: 22px;

    text-align: center;

    color: #ff3333;

    font-size: 8px;

    letter-spacing: 5px;

    opacity: .8;

    text-shadow:
        0 0 8px #ff000088;
}


/* =====================================================
   PROFILE
===================================================== */

.profile {

    position: relative;

    width: 150px;
    height: 150px;

    margin: 0 auto 25px;

    display: flex;

    justify-content: center;
    align-items: center;
}


/* OUTER ENERGY RING */

.profile::before {

    content: "";

    position: absolute;

    inset: -12px;

    border-radius: 50%;

    border:
        2px dashed #ff0000;

    box-shadow:

        0 0 15px #ff0000,
        0 0 35px #ff000066;

    animation:
        rotate 7s linear infinite;
}


/* SECOND RING */

.profile::after {

    content: "";

    position: absolute;

    inset: -4px;

    border-radius: 50%;

    border:
        1px solid #ff5555;

    box-shadow:
        inset 0 0 20px #ff000055;

    animation:
        rotateReverse 10s linear infinite;
}

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}

@keyframes rotateReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }

}


/* =====================================================
   PROFILE IMAGE
===================================================== */

.circle {

    position: relative;

    width: 115px;
    height: 115px;

    border-radius: 50%;

    overflow: hidden;

    background: #000;

    border: 4px solid #ff0000;

    box-shadow:

        0 0 15px #ff0000,
        0 0 35px #ff000066,
        0 0 70px #ff000033,

        inset 0 0 20px #000;

    z-index: 2;
}


/* PROFILE LIGHT */

.circle::after {

    content: "";

    position: absolute;

    top: -100%;
    left: -100%;

    width: 250%;
    height: 250%;

    background:

        linear-gradient(
            120deg,
            transparent 35%,
            rgba(255,255,255,.45) 50%,
            transparent 65%
        );

    transform: rotate(20deg);

    animation:
        profileShine 4s infinite;

    pointer-events: none;
}

@keyframes profileShine {

    0% {
        transform:
            translate(-60%, -60%)
            rotate(20deg);
    }

    45% {
        transform:
            translate(60%, 60%)
            rotate(20deg);
    }

    100% {
        transform:
            translate(60%, 60%)
            rotate(20deg);
    }

}


.circle img {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}


/* =====================================================
   SECTION
===================================================== */

.section {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 10px;

    color: #777;

    font-size: 8px;

    letter-spacing: 3px;
}

.section::before {

    content: "";

    width: 35px;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff0000
        );

    box-shadow:
        0 0 8px #ff0000;
}


/* =====================================================
   BUTTONS
===================================================== */

.buttons {

    display: flex;

    flex-direction: column;

    gap: 12px;

    width: 100%;
}


/* =====================================================
   BUTTON
===================================================== */

.button {

    position: relative;

    width: 100%;
    height: 66px;

    display: flex;

    align-items: center;

    padding: 0 18px;

    color: white;

    text-decoration: none;

    background:

        linear-gradient(
            100deg,
            #250000,
            #700000,
            #d00000,
            #720000,
            #250000
        );

    background-size: 300% 100%;

    border: 1px solid #ff3030;

    box-shadow:

        0 0 12px #ff000033,

        inset 0 0 18px #300000;

    overflow: hidden;

    opacity: 0;

    transform:
        translateY(25px)
        scale(.96);

    animation:

        buttonIn .7s forwards,
        gradientMove 5s ease infinite;

    transition:
        .25s ease;
}


/* MOVING GRADIENT */

@keyframes gradientMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


/* =====================================================
   NUMBER
===================================================== */

.button-number {

    width: 38px;

    color: #ff7777;

    font-size: 10px;

    letter-spacing: 1px;

    opacity: .9;

    text-shadow:
        0 0 8px #ff0000;
}


/* =====================================================
   ICON
===================================================== */

.social-icon {

    width: 32px;
    height: 32px;

    object-fit: contain;

    margin-right: 15px;

    filter:
        drop-shadow(0 0 5px #000);

    transition:
        .25s ease;
}


/* =====================================================
   TEXT
===================================================== */

.button span {

    font-size: 20px;

    font-weight: 800;

    letter-spacing: 3px;

    text-shadow:

        0 0 5px #fff,
        0 0 15px #ff000055;
}


/* =====================================================
   MOVING LIGHT
===================================================== */

.button::before {

    content: "";

    position: absolute;

    top: 0;

    left: -120%;

    width: 75%;
    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    transform:
        skewX(-25deg);

    animation:
        buttonShine 3.5s infinite;

    pointer-events: none;
}

@keyframes buttonShine {

    0% {
        left: -120%;
    }

    35% {
        left: 140%;
    }

    100% {
        left: 140%;
    }

}


/* =====================================================
   CORNER
===================================================== */

.button::after {

    content: "";

    position: absolute;

    right: 0;
    bottom: 0;

    width: 24px;
    height: 24px;

    border-right:
        2px solid #ff4444;

    border-bottom:
        2px solid #ff4444;

    box-shadow:
        5px 5px 12px #ff000044;
}


/* =====================================================
   BUTTON ANIMATION
===================================================== */

.button:nth-child(1) {
    animation-delay: .15s, 0s;
}

.button:nth-child(2) {
    animation-delay: .35s, .5s;
}

.button:nth-child(3) {
    animation-delay: .55s, 1s;
}


@keyframes buttonIn {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.94);

        filter:
            blur(6px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

        filter:
            blur(0);
    }

}


/* =====================================================
   HOVER
===================================================== */

.button:hover {

    transform:
        translateX(7px)
        scale(1.025);

    border-color: #ffffff;

    box-shadow:

        0 0 20px #ff0000aa,
        0 0 45px #ff000044,

        inset 0 0 25px #ff555555;
}


.button:hover .social-icon {

    transform:
        scale(1.2)
        rotate(-3deg);

    filter:

        drop-shadow(0 0 5px white)
        drop-shadow(0 0 12px red);
}


.button:active {

    transform:
        scale(.97);
}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    margin-top: 18px;

    text-align: center;

    color: #444;

    font-size: 6px;

    letter-spacing: 4px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    body {

        padding: 10px;
    }

    .ui-window {

        width: 94vw;

        padding:
            21px 16px;
    }

    .welcome {

        font-size: 15px;

        letter-spacing: 2px;
    }

    .profile {

        width: 105px;
        height: 105px;

        margin-bottom: 20px;
    }

    .circle {

        width: 88px;
        height: 88px;
    }

    .button {

        height: 56px;

        padding:
            0 12px;
    }

    .button-number {

        width: 27px;

        font-size: 8px;
    }

    .social-icon {

        width: 27px;
        height: 27px;

        margin-right: 10px;
    }

    .button span {

        font-size: 15px;

        letter-spacing: 2px;
    }

}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media (max-width: 380px) {

    body {

        padding: 6px;
    }

    .ui-window {

        width: 96vw;

        padding:
            17px 12px;
    }

    .welcome {

        font-size: 13px;

        letter-spacing: 1px;
    }

    .profile {

        width: 90px;
        height: 90px;
    }

    .circle {

        width: 76px;
        height: 76px;
    }

    .button {

        height: 50px;
    }

    .button span {

        font-size: 13px;

        letter-spacing: 1px;
    }

    .social-icon {

        width: 23px;
        height: 23px;
    }

}

</style>

</head>

<script>

/* =====================================================
   WELCOME TYPEWRITER
===================================================== */

const text =
    "WELCOME TO MY WORLD";

const welcome =
    document.getElementById("welcome");

let index = 0;


function typeWelcome() {

    if (index < text.length) {

        welcome.textContent +=
            text.charAt(index);

        index++;

        setTimeout(
            typeWelcome,
            85
        );

    }

}

typeWelcome();

</script>
